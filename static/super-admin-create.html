<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Custom Module — Admin Console</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=5">
  
  <style>
    body {
      background: #17171e !important;
      color: #f3f6f9 !important;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Premium Sidebar styles matching the screenshot */
    .sidebar-admin {
      width: 260px;
      background: #111117;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.03);
      padding: 24px 0;
      flex-shrink: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.02);
    }

    .menu-item.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid #00d4aa;
      padding-left: 17px;
    }

    .container-layout {
      max-width: 900px;
      margin: 0 auto;
    }

    .glass-card {
      background: #1a1a24;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .glass-card h2 {
      font-size: 16px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group label {
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }

    .form-control {
      background: #1e1e28 !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      color: #f3f6f9 !important;
      border-radius: 8px !important;
      padding: 12px 14px !important;
      font-size: 13px !important;
      transition: all 0.3s ease !important;
      width: 100%;
      box-sizing: border-box;
    }

    .form-control:focus {
      border-color: #00d4aa !important;
      box-shadow: 0 0 15px rgba(0, 212, 170, 0.15) !important;
      background: #1e1e28 !important;
      outline: none !important;
    }

    select.form-control {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E") !important;
      background-repeat: no-repeat !important;
      background-position: right 12px center !important;
      background-size: 16px !important;
      padding-right: 36px !important;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d4aa 0%, #0284c7 100%) !important;
      border: none !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      padding: 14px 20px !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      font-size: 13px !important;
      box-shadow: 0 8px 20px rgba(0, 212, 170, 0.15) !important;
      transition: all 0.3s ease !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
    }

    .btn-primary:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 12px 25px rgba(0, 212, 170, 0.25) !important;
    }

    .btn-action {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13.5px;
      padding: 8px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
    }

    .btn-danger-hover:hover {
      color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.08) !important;
    }

    .col-builder-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .badge-custom {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      border: none;
      cursor: pointer;
    }

    .badge-custom.active {
      background: rgba(0, 212, 170, 0.15);
      color: #00d4aa;
    }
  </style>
</head>
<body>

  <div id="app" style="display: flex; min-height: 100vh;">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar-admin">
      <!-- Brand Logo & Name -->
      <div style="padding: 0 24px 20px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px dashed rgba(255,255,255,0.06);">
        <img src="logo.jpg" alt="Logo" id="sidebar-brand-logo" style="width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1);">
        <span id="sidebar-brand-name" style="font-size: 16px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px;">Arfa Nova</span>
      </div>

      <!-- User Profile Card -->
      <div style="display: flex; flex-direction: column; align-items: center; padding: 24px; text-align: center;">
        <div style="position: relative; width: 76px; height: 76px; margin-bottom: 12px;">
          <img src="logo.jpg" id="profile-avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #00d4aa; box-shadow: 0 0 15px rgba(0, 212, 170, 0.25);">
        </div>
        <h3 style="font-size: 14.5px; font-weight: 700; color: #ffffff; margin: 0;">Master Admin</h3>
        <p style="font-size: 10px; color: #00d4aa; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; margin: 4px 0 0 0;">Control Console</p>
        
        <!-- Social/Action icons shortcut -->
        <div style="display: flex; gap: 14px; margin-top: 14px; color: rgba(255,255,255,0.4); font-size: 13px;">
          <a href="./index.html" target="_blank" title="Launch Hospital App" style="color: inherit; transition: color 0.2s;"><i class="fas fa-external-link-alt"></i></a>
          <a href="./super-admin-db.html" title="Database Explorer" style="color: inherit; transition: color 0.2s;"><i class="fas fa-database"></i></a>
          <a href="./super-admin.html" title="System Settings" style="color: inherit; transition: color 0.2s;"><i class="fas fa-cog"></i></a>
        </div>
      </div>

      <!-- Navigation Menu -->
      <nav style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px; flex: 1; margin-top: 10px;">
        <a href="./super-admin.html" class="menu-item" id="menu-branding">
          <i class="fas fa-palette"></i> Branding & Modules
        </a>
        <a href="./super-admin-create.html" class="menu-item active" id="menu-create">
          <i class="fas fa-tools"></i> Create Module
        </a>
        <a href="./super-admin-db.html" class="menu-item" id="menu-db">
          <i class="fas fa-database"></i> Database Explorer
        </a>
        
        <div style="border-top: 1px dashed rgba(255,255,255,0.06); margin: 15px 0; padding-top: 15px;">
          <span style="font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; padding-left: 20px; display: block; margin-bottom: 8px;">Support</span>
          <a href="./index.html" target="_blank" class="menu-item" style="color: #38bdf8 !important;">
            <i class="fas fa-rocket"></i> Launch Hospital App
          </a>
        </div>
      </nav>
    </aside>

    <!-- RIGHT MAIN CONTENT PANEL -->
    <main style="flex: 1; background: #17171e; display: flex; flex-direction: column; overflow-y: auto;">
      
      <!-- Top Header -->
      <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.03); background: #111117;">
        <div>
          <h2 id="page-display-title" style="font-size: 18px; font-weight: 700; color: #ffffff; margin: 0;">Create Custom Module</h2>
        </div>
        
        <!-- Decorative Search Pill from screenshot -->
        <div style="position: relative; width: 340px;">
          <i class="fas fa-search" style="position: absolute; left: 16px; top: 12px; color: rgba(255,255,255,0.3); font-size: 12px;"></i>
          <input type="text" placeholder="Search..........." disabled style="width: 100%; background: #1a1a24; border: 1px solid rgba(255,255,255,0.05); color: #ffffff; border-radius: 20px; padding: 8px 16px 8px 38px; font-size: 12px; font-family: inherit;">
        </div>

        <!-- Right Bell and Avatar -->
        <div style="display: flex; align-items: center; gap: 20px;">
          <div style="position: relative; cursor: pointer;">
            <i class="far fa-bell" style="font-size: 18px; color: rgba(255,255,255,0.6);"></i>
            <span style="position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; background: #ef4444; border-radius: 50%;"></span>
          </div>
        </div>
      </header>

      <!-- Page Body Content -->
      <div style="padding: 40px;">
        <div class="container-layout">
          
          <div class="glass-card">
            <h2><i class="fas fa-tools" style="color:#00d4aa;"></i> Create New Custom Module</h2>
            <form id="create-module-form" onsubmit="handleCreateModule(event)">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px;">
                <div class="form-group">
                  <label>Module Page Name (e.g. Research Log)</label>
                  <input type="text" id="new-module-title" class="form-control" placeholder="Clinical Registry" required>
                </div>
                <div class="form-group">
                  <label>Module Slug / Key (a-z, 0-9, _ only)</label>
                  <input type="text" id="new-module-key" class="form-control" placeholder="clinical_registry" required>
                </div>
              </div>
              <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; margin-bottom: 16px;">
                <div class="form-group">
                  <label>Sub-heading Description</label>
                  <input type="text" id="new-module-subtitle" class="form-control" placeholder="Management of clinical trials & observations" required>
                </div>
                <div class="form-group">
                  <label>FontAwesome Icon Class</label>
                  <select id="new-module-icon" class="form-control">
                    <option value="fas fa-folder-open">📁 Folder Open</option>
                    <option value="fas fa-vial">🧪 Lab Vial</option>
                    <option value="fas fa-ambulance">🚑 Ambulance</option>
                    <option value="fas fa-heartbeat">💓 Heartbeat</option>
                    <option value="fas fa-signature">✍️ E-Sign Signature</option>
                    <option value="fas fa-address-book">📖 Address Book</option>
                    <option value="fas fa-boxes">📦 Supply Boxes</option>
                    <option value="fas fa-user-md">👨‍⚕️ Doctor Avatar</option>
                    <option value="fas fa-receipt">🧾 Billing Receipt</option>
                  </select>
                </div>
              </div>

              <!-- Dynamic Columns Builder -->
              <div class="form-group" style="margin-bottom: 24px;">
                <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                  <span>Database Columns / Fields</span>
                  <button type="button" class="badge-custom active" onclick="addColumnField()"><i class="fas fa-plus"></i> Add Field</button>
                </label>
                <div id="columns-builder-container">
                  <div class="col-builder-item">
                    <input type="text" class="form-control dyn-col-input" placeholder="Field 1 (e.g. Researcher)" style="flex:1;" required>
                    <span style="font-size:11px; color:#64748b; font-family:var(--font-mono); font-weight:700; margin-left: 5px;">TEXT</span>
                    <button type="button" class="btn-action btn-danger-hover" onclick="removeColumnField(this)"><i class="fas fa-trash-alt"></i></button>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn-primary" style="width: 100%; font-weight: 700;">
                <i class="fas fa-plus-circle"></i> Create Module & SQLite Database
              </button>
            </form>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" style="position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px;"></div>

  <script>
    // Simple toast helper
    function showToast(title, msg, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.style.background = "rgba(17, 24, 39, 0.95)";
      toast.style.borderLeft = "4px solid " + (type === "success" ? "#00d4aa" : type === "warning" ? "#f59e0b" : "#ef4444");
      toast.style.borderTop = "1px solid rgba(255,255,255,0.08)";
      toast.style.borderBottom = "1px solid rgba(255,255,255,0.08)";
      toast.style.borderRight = "1px solid rgba(255,255,255,0.08)";
      toast.style.borderRadius = "8px";
      toast.style.padding = "14px 18px";
      toast.style.color = "#ffffff";
      toast.style.boxShadow = "0 10px 25px rgba(0,0,0,0.3)";
      toast.style.fontSize = "13px";
      toast.style.width = "280px";
      toast.style.opacity = "0";
      toast.style.transform = "translateY(20px)";
      toast.style.transition = "all 0.3s ease";
      
      toast.innerHTML = `
        <div style="font-weight:700; margin-bottom:3px; display:flex; align-items:center; gap:6px;">
          <i class="fas ${type==='success'?'fa-check-circle':type==='warning'?'fa-exclamation-circle':'fa-times-circle'}" style="color:${type==='success'?'#00d4aa':type==='warning'?'#f59e0b':'#ef4444'}"></i>
          ${title}
        </div>
        <div style="color:#94a3b8; font-size:12px;">${msg}</div>
      `;
      
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "1";
        toast.style.transform = "translateY(0)";
      }, 50);
      
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>
  <script src="js/super-admin.js?v=5"></script>
</body>
</html>
